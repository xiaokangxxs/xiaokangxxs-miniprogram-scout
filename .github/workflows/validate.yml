name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate Skill
        run: npm run validate

      - name: Validate Rolling Pool
        run: npm run validate:pool

      - name: Validate WorkBuddy Expert Team
        run: npm run validate:workbuddy

      - name: Scan for committed secrets
        run: npm run scan:secrets
