name: Feature request
description: Suggest a new scoring rule, workflow, output, Agent compatibility improvement, or product insight.
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What bad decision or missing workflow does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Mini Program
        - Mini Game
        - Both
        - Agent compatibility
        - Documentation / tooling
    validations:
      required: true
  - type: textarea
    id: eval
    attributes:
      label: How should we evaluate it?
      description: Add at least one prompt/case that should change behavior.
