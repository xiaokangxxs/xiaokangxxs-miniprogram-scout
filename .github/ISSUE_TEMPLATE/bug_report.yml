name: Bug report
description: Report incorrect routing, scoring, source behavior, broken docs, or repository checks.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve xiaokangxxs-miniprogram-scout.
        **Do not paste API tokens, cookies, private reports, or other secrets.**
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.3.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mini Program scoring
        - Mini Game scoring
        - Product Form Router
        - Data source / fallback
        - WeChat policy / readiness
        - Installation / compatibility
        - Repository validation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt / input
      description: Remove private or sensitive information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Security check
      options:
        - label: I removed tokens, passwords, private user data and confidential reports.
          required: true
