name: Data source request
description: Propose a product, demand, game, keyword, or validation source.
title: "[Source] "
labels: []
body:
  - type: input
    id: source
    attributes:
      label: Source name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL / docs
    validations:
      required: true
  - type: dropdown
    id: official
    attributes:
      label: Source type
      options:
        - Official API
        - Official feed
        - Official public page
        - Third-party feed/API
        - Community source
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why it improves scouting
    validations:
      required: true
  - type: textarea
    id: access
    attributes:
      label: Auth, pricing, rate limits, terms, commercial-use notes
      description: If unknown, say Unknown. Do not paste credentials.
    validations:
      required: true
  - type: textarea
    id: fields
    attributes:
      label: Useful fields / signals
