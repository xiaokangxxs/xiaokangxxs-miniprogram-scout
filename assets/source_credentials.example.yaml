# Example only. DO NOT put real secrets in a shared/repository copy.
credentials:
  producthunt_token_env: PRODUCTHUNT_TOKEN
  github_token_env: GITHUB_TOKEN

sources:
  producthunt: true
  producthunt_allow_public_web_fallback: true
  hackernews: true
  neeed: true
  github: true
  github_prefer_rest_api: true
  betalist: true
  indiehackers_unofficial: true
  reddit: false
  g2: false

run_defaults:
  fresh_lookback_hours: 24
  sparse_fallback_lookback_hours: 72
  rolling_pool_days: 14
  champion_board_size: 20
  per_source_limit: 30
  minimum_opportunity_score: 65
  top_n: 10
  full_prd_top_n: 3
  require_keyword_validation_for_top3_when_unobserved: true
  calculate_readiness_separately: true
  calculate_confidence_separately: true
