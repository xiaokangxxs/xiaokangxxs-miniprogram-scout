# Example only. Never commit real secrets.

credentials:
  producthunt_token_env: PRODUCTHUNT_TOKEN
  github_token_env: GITHUB_TOKEN

product_sources:
  producthunt: true
  hackernews: true
  neeed: true
  github: true
  betalist: true
  indiehackers_unofficial: true
  reddit: false
  g2: false

game_sources:
  itch_io: true
  poki: true
  steam: true
  crazygames: true
  game_jams: true

run_defaults:
  fresh_lookback_hours: 24
  sparse_fallback_hours: 72
  rolling_pool_days: 14
  mini_program_champion_size: 20
  mini_game_champion_size: 20
  per_source_limit: 30
  mini_program_top_n: 10
  mini_game_top_n: 10
  cross_category_best_bets: 5
  verify_wechat_official_constraints: true
  require_keyword_validation_when_unobserved: true
