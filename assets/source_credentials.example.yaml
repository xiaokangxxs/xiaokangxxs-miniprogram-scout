# Example only. DO NOT put real secrets in a shared/repository copy.
credentials:
  producthunt_token_env: PRODUCTHUNT_TOKEN
  github_token_env: GITHUB_TOKEN

sources:
  producthunt: true
  producthunt_allow_public_web_fallback: true
  hackernews: true
  neeed: true
  github: true
  github_prefer_rest_api: true
  betalist: true
  indiehackers_unofficial: true
  reddit: false
  g2: false

run_defaults:
  lookback_hours: 24
  fallback_lookback_hours: 72
  per_source_limit: 30
  minimum_effective_opportunity_score: 70
  full_prd_top_n: 3
  china_feasibility_gate: true
