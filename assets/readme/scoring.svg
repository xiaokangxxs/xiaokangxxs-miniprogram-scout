<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690">
  <rect width="1280" height="690" rx="28" fill="#f7f9fc"/>
  <text x="64" y="72" font-size="34" font-weight="700" fill="#132238" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Two opportunity engines · 两套评分，不混用</text>
  <text x="64" y="108" font-size="18" fill="#64748b" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">小程序先看“问题值不值得解决”；小游戏先看“玩家会不会想再来一局”。</text>

  <rect x="64" y="150" width="552" height="470" rx="24" fill="#fff" stroke="#dce5ef"/>
  <rect x="664" y="150" width="552" height="470" rx="24" fill="#fff" stroke="#dce5ef"/>
  <text x="96" y="198" font-size="24" font-weight="700" fill="#0969da" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">微信小程序 · 100</text>
  <text x="696" y="198" font-size="24" font-weight="700" fill="#1a7f37" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">微信小游戏 · 100</text>

  <g font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#334155">
    <text x="96" y="244">搜索需求与意图</text><text x="560" y="244" text-anchor="end" font-weight="700">20</text>
    <rect x="96" y="258" width="420" height="12" rx="6" fill="#e8eef7"/><rect x="96" y="258" width="420" height="12" rx="6" fill="#58a6ff"/>
    <text x="96" y="310">刚需 / 痛点</text><text x="560" y="310" text-anchor="end" font-weight="700">20</text>
    <rect x="96" y="324" width="420" height="12" rx="6" fill="#e8eef7"/><rect x="96" y="324" width="420" height="12" rx="6" fill="#4f9af1"/>
    <text x="96" y="376">小众切口</text><text x="560" y="376" text-anchor="end" font-weight="700">15</text>
    <rect x="96" y="390" width="420" height="12" rx="6" fill="#e8eef7"/><rect x="96" y="390" width="315" height="12" rx="6" fill="#7ab8ff"/>
    <text x="96" y="442">商业价值 + 微信适配</text><text x="560" y="442" text-anchor="end" font-weight="700">20</text>
    <rect x="96" y="456" width="420" height="12" rx="6" fill="#e8eef7"/><rect x="96" y="456" width="420" height="12" rx="6" fill="#2f81f7"/>
    <text x="96" y="508">热度 + 新鲜度 + 开发杠杆</text><text x="560" y="508" text-anchor="end" font-weight="700">23</text>
    <rect x="96" y="522" width="420" height="12" rx="6" fill="#e8eef7"/><rect x="96" y="522" width="420" height="12" rx="6" fill="#8b5cf6"/>
    <text x="96" y="574">产品杠杆</text><text x="560" y="574" text-anchor="end" font-weight="700">2</text>
    <rect x="96" y="588" width="420" height="12" rx="6" fill="#e8eef7"/><rect x="96" y="588" width="42" height="12" rx="6" fill="#94a3b8"/>

    <text x="696" y="244">3–10 秒玩法 Hook</text><text x="1160" y="244" text-anchor="end" font-weight="700">20</text>
    <rect x="696" y="258" width="420" height="12" rx="6" fill="#eaf4ee"/><rect x="696" y="258" width="420" height="12" rx="6" fill="#3ddc97"/>
    <text x="696" y="310">复玩 / 留存</text><text x="1160" y="310" text-anchor="end" font-weight="700">15</text>
    <rect x="696" y="324" width="420" height="12" rx="6" fill="#eaf4ee"/><rect x="696" y="324" width="315" height="12" rx="6" fill="#39c98a"/>
    <text x="696" y="376">微信社交传播</text><text x="1160" y="376" text-anchor="end" font-weight="700">15</text>
    <rect x="696" y="390" width="420" height="12" rx="6" fill="#eaf4ee"/><rect x="696" y="390" width="315" height="12" rx="6" fill="#2eb67d"/>
    <text x="696" y="442">广告 / 付费适配</text><text x="1160" y="442" text-anchor="end" font-weight="700">15</text>
    <rect x="696" y="456" width="420" height="12" rx="6" fill="#eaf4ee"/><rect x="696" y="456" width="315" height="12" rx="6" fill="#26a269"/>
    <text x="696" y="508">热度 + 新鲜度</text><text x="1160" y="508" text-anchor="end" font-weight="700">20</text>
    <rect x="696" y="522" width="420" height="12" rx="6" fill="#eaf4ee"/><rect x="696" y="522" width="420" height="12" rx="6" fill="#f59e0b"/>
    <text x="696" y="574">开发杠杆 + 竞争空位</text><text x="1160" y="574" text-anchor="end" font-weight="700">15</text>
    <rect x="696" y="588" width="420" height="12" rx="6" fill="#eaf4ee"/><rect x="696" y="588" width="315" height="12" rx="6" fill="#84cc16"/>
  </g>

  <text x="640" y="657" text-anchor="middle" font-size="17" fill="#64748b" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">Opportunity / Readiness / Confidence 分开输出：好机会不因一个阻塞项被“强行压成普通机会”。</text>
</svg>
